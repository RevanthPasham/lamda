name: Deploy Lambda

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Create Lambda deployment ZIP
        shell: bash
        run: |
          mkdir -p lambda-package
          cp dist/handler.js package.json package-lock.json lambda-package/
          cp -R node_modules lambda-package/
          cd lambda-package
          zip -qr ../lambda.zip .

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to existing Lambda function
        run: aws lambda update-function-code --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" --zip-file fileb://lambda.zip

      - name: Report deployment success
        run: >-
          echo "Deployment successful: Lambda function ${{ vars.LAMBDA_FUNCTION_NAME }} was updated."
